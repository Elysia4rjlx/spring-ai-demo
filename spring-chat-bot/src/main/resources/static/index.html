<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="基于 Spring AI 的智能聊天助手">
    <title>Claude · 智能助手</title>
    <link rel="stylesheet" href="/css/style.css">

    <!-- Markdown 渲染依赖：联网时增强，离线时自动降级到内置渲染器 -->
    <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script defer src="/js/markdown.js"></script>
    <script defer src="/js/app.js"></script>
</head>
<body>
<div class="app">

    <!-- ============ 左侧边栏 ============ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="brand">
                <span class="brand-logo" id="brandLogo"></span>
                <span class="brand-name">Claude</span>
                <button class="sidebar-close" id="sidebarClose" aria-label="关闭侧边栏">×</button>
            </div>

            <button class="new-chat" id="newChatBtn">
                <span class="new-chat-icon">＋</span>
                <span>新建会话</span>
            </button>
        </div>

        <div class="chat-list" id="chatList">
            <div class="list-empty">还没有会话</div>
        </div>

        <div class="sidebar-footer">
            <div class="user-chip">
                <span class="avatar">E</span>
                <span class="user-meta">
                    <span class="user-name">Elyjah</span>
                    <span class="user-sub">本地模型 · qwen2.5</span>
                </span>
            </div>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- ============ 主区域 ============ -->
    <main class="main">
        <header class="topbar">
            <button class="menu-btn" id="menuBtn" aria-label="打开菜单">
                <span></span><span></span><span></span>
            </button>
            <div class="topbar-title" id="topbarTitle">新对话</div>
            <div class="topbar-right">
                <span class="model-badge"><span class="dot"></span>qwen2.5:3b</span>
            </div>
        </header>

        <!-- 对话消息区 -->
        <div class="messages" id="messages">
            <!-- 空状态 / 消息由 JS 渲染 -->
        </div>

        <!-- 底部输入区 -->
        <div class="composer-wrap">
            <div class="error-bar" id="errorBar" hidden>
                <span class="error-icon">!</span>
                <span class="error-text" id="errorText"></span>
                <button class="error-close" id="errorClose" aria-label="关闭提示">×</button>
            </div>

            <div class="composer">
                <textarea id="input" rows="1" placeholder="给 Claude 发送消息…" autocomplete="off"></textarea>
                <button class="send-btn" id="sendBtn" title="发送 (Enter)" aria-label="发送">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v13m0 0l-5-5m5 5l5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="stop-btn" id="stopBtn" title="停止生成" aria-label="停止生成" hidden>
                    <span class="stop-square"></span>
                </button>
            </div>
            <div class="composer-hint">Enter 发送 · Shift + Enter 换行 · Claude 也可能会犯错，请核查重要信息。</div>
        </div>
    </main>

</div>
</body>
</html>
